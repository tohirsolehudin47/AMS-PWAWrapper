<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>AMS Lite Plus — Manajemen Surat Digital</title>
  <meta name="theme-color" content="#1e2246">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AMS Lite Plus">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='38' fill='%234361ee'/%3E%3Ctext x='50%25' y='56%25' text-anchor='middle' fill='%23fff' font-family='Arial' font-weight='bold' font-size='56'%3EAMS%3C/text%3E%3C/svg%3E">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #1e2246; overflow: hidden; font-family: system-ui, sans-serif; }
    iframe { width: 100%; height: 100%; border: 0; display: block; }
    #installBar {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      background: linear-gradient(90deg, #4361ee, #7b2cbf); color: #fff;
      padding: 10px 18px; border-radius: 999px; box-shadow: 0 10px 30px rgba(0,0,0,.4);
      display: none; align-items: center; gap: 12px; font-size: 13px; font-weight: 600; z-index: 999;
    }
    #installBar button {
      background: #fff; color: #1e2246; border: 0; padding: 6px 14px; border-radius: 999px;
      font-weight: 700; cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- GANTI URL DI BAWAH DENGAN URL DEPLOYMENT WEB APP GOOGLE APPS SCRIPT ANDA -->
  <iframe id="appFrame" src="https://script.google.com/macros/s/GANTI_DENGAN_DEPLOYMENT_ID_ANDA/exec" allow="clipboard-read; clipboard-write; camera"></iframe>

  <div id="installBar">
    <span>Install AMS Lite Plus di HP Anda</span>
    <button id="btnInstallNow">Install</button>
    <button style="background:transparent;color:#fff;padding:4px 8px;" onclick="document.getElementById('installBar').style.display='none'">&times;</button>
  </div>

  <script>
    const qs = window.location.search;
    if (qs) {
      const f = document.getElementById('appFrame');
      f.src = f.src + qs;
    }
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('installBar').style.display = 'flex';
    });
    document.getElementById('btnInstallNow').addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      document.getElementById('installBar').style.display = 'none';
    });
  </script>
</body>
</html>
